[project]
name = "enterprise-expense-auditor"
version = "0.1.0"
description = "Enterprise Expense Policy Compliance Auditor built with LangGraph, LangSmith, and Google Gemini"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "google-genai>=0.1.1",
    "langsmith>=0.1.100",
    "rich>=13.7.0",
    "tabulate>=0.9.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
expense-auditor = "expense_auditor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expense_auditor", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
